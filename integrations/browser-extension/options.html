<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RAGbase Shield</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <main>
    <h1><img src="icons/icon48.png" alt=""><span data-i18n="optTitle">RAGbase Shield : options</span></h1>
    <p class="muted" data-i18n="optIntro"></p>

    <section class="card">
      <label class="inline"><input type="checkbox" id="enabled"><span data-i18n="optEnabled"></span></label>
      <p class="muted" data-i18n="optSites"></p>
      <p class="notice" data-i18n="optWarning"></p>
    </section>

    <section class="card">
      <label for="token" data-i18n="optToken"></label>
      <div class="row">
        <input type="password" id="token" autocomplete="off" spellcheck="false">
        <button type="button" id="toggleToken" data-i18n="optShow"></button>
      </div>
      <p class="muted" data-i18n="optTokenHelp"></p>

      <label for="port" data-i18n="optPort"></label>
      <input type="number" id="port" min="1024" max="65535" step="1">

      <div class="row">
        <button type="button" class="primary" id="test" data-i18n="optTest"></button>
        <span class="status" id="status" role="status" aria-live="polite"></span>
      </div>
    </section>

    <section class="card">
      <label for="dossier" data-i18n="optDossier"></label>
      <div class="row">
        <select id="dossier"></select>
        <button type="button" id="reload" data-i18n="optReload"></button>
      </div>
      <p class="muted" data-i18n="optDossierHelp"></p>
      <p class="notice" id="dossierWarn" data-i18n="optDossierWarn" hidden></p>
    </section>

    <p class="muted" data-i18n="optPrivacy"></p>
    <p class="status ok" id="saved" role="status" aria-live="polite"></p>
  </main>
  <script src="common.js"></script>
  <script src="options.js"></script>
</body>
</html>
