name: Question
description: Ask how to install or use RAGbase Shield.
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        **Never paste client data here.** No real names, addresses, numbers, documents or file paths of a client.
        Use invented text only. This page is public.

        Vous pouvez écrire en français. **Ne collez jamais de données de client ici.**

        Install guide: [docs/INSTALL.md](https://github.com/ragbase/ragbase-shield/blob/main/docs/INSTALL.md). FAQ: [docs/FAQ.md](https://github.com/ragbase/ragbase-shield/blob/main/docs/FAQ.md).
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Other
    validations:
      required: true
  - type: input
    id: claude_version
    attributes:
      label: Claude app version
      description: The version shown in the About window of the Claude app. Write "not used" if you do not use the Claude app.
  - type: input
    id: shield_version
    attributes:
      label: Shield version
      description: The Shield version, as far as you know it. With the command line, the output of "ragbase-shield --version".
      placeholder: "0.4.4"
  - type: textarea
    id: question
    attributes:
      label: Your question
      description: Use invented text only.
    validations:
      required: true
  - type: checkboxes
    id: no_client_data
    attributes:
      label: Client data
      options:
        - label: This question holds no real client data (names, numbers, documents, paths).
          required: true
