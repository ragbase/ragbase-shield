# Publish server.json (repository root) to the official MCP Registry.
# Copy this file to .github/workflows/publish-mcp.yml in the public repository.
#
# Why GitHub Actions: the name io.github.ragbase/ragbase-shield is an ORGANISATION namespace. The interactive
# "mcp-publisher login github" cannot publish to an organisation namespace today (registry issue #1468).
# GitHub Actions OIDC can, and it needs no secret: GitHub gives the job a short-lived token.
#
# Run it by hand (Actions > Publish to MCP Registry > Run workflow), only AFTER the ragbase-shield version of
# server.json is on PyPI: the registry checks the "mcp-name: io.github.ragbase/ragbase-shield" line in the PyPI
# description.
name: Publish to MCP Registry

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # OIDC token for "mcp-publisher login github-oidc"
      contents: read
    env:
      MCP_PUBLISHER_VERSION: v1.8.9
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Download and verify mcp-publisher
        run: |
          set -euo pipefail
          os="$(uname -s | tr '[:upper:]' '[:lower:]')"
          arch="$(uname -m | sed 's/x86_64/amd64/;s/aarch64/arm64/')"
          archive="mcp-publisher_${os}_${arch}.tar.gz"
          base_url="https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}"
          curl --fail --location --silent --show-error --output "$archive" "$base_url/$archive"
          curl --fail --location --silent --show-error --output "$archive.sigstore.json" "$base_url/$archive.sigstore.json"
          cosign verify-blob \
            --bundle "$archive.sigstore.json" \
            --certificate-identity "https://github.com/modelcontextprotocol/registry/.github/workflows/release.yml@refs/tags/${MCP_PUBLISHER_VERSION}" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "$archive"
          tar xzf "$archive" mcp-publisher
          rm -f "$archive" "$archive.sigstore.json"

      - name: Validate server.json
        run: ./mcp-publisher validate server.json

      - name: Check that the PyPI version exists
        run: |
          set -euo pipefail
          version="$(python3 -c 'import json; print(json.load(open("server.json"))["packages"][0]["version"])')"
          curl --fail --silent --show-error --output /dev/null "https://pypi.org/pypi/ragbase-shield/${version}/json"
          echo "ragbase-shield ${version} is on PyPI"

      - name: Authenticate to MCP Registry
        run: ./mcp-publisher login github-oidc

      - name: Publish server to MCP Registry
        run: ./mcp-publisher publish server.json
